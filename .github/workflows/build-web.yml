name: Build Flutter Web

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API Base URL'
        required: true
        default: 'https://festapp-all-data.onrender.com'
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'backend/**'

permissions:
  contents: write

jobs:
  build:
    name: Build & Export Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          API_URL="${{ github.event.inputs.api_base_url || 'https://festapp-all-data.onrender.com' }}"
          echo "Building Web with API: $API_URL"
          flutter build web --release --dart-define=API_BASE_URL=$API_URL

      - name: Upload Web Build to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amia-fest-web-build
          path: build/web
          retention-days: 30

      - name: Package Web Build as Zip
        run: |
          mkdir -p dist
          cd build/web && zip -r ../../dist/amia-fest-web.zip . && cd ../..

      - name: Upload Zip to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amia-fest-web-zip
          path: dist/amia-fest-web.zip
          retention-days: 30
