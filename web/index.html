<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="askesis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>askesis</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    body {
      background-color: #F3EBDD; /* Match bgCream from AppTheme */
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }
    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .gem-accent {
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .wordmark {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1;
    }
    .wordmark .ask {
      color: #8C2A2A;
    }
    .wordmark .esis {
      color: #2E2A26;
    }
    .subtitle {
      margin-top: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: rgba(46, 42, 38, 0.75);
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 500;
    }
    .dots {
      margin-top: 48px;
      width: 72px;
      height: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(1) {
      background-color: #8C2A2A;
      animation-delay: 0s;
    }
    .dot:nth-child(2) {
      background-color: #D9A62E;
      animation-delay: 0.18s;
    }
    .dot:nth-child(3) {
      background-color: #7A8B3F;
      animation-delay: 0.36s;
    }
    .dot:nth-child(4) {
      background-color: #3F5A3D;
      animation-delay: 0.54s;
    }
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }
  </style>
  <div id="splash">
    <div class="gem-accent">
      <svg width="20" height="26" viewBox="0 0 20 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 0L20 14.3L10 26L0 14.3L10 0Z" fill="#8C2A2A"/>
        <line x1="10" y1="3.9" x2="10" y2="22.1" stroke="white" stroke-opacity="0.35" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="wordmark">
      <span class="ask">ASK</span><span class="esis">ESIS</span>
    </div>
    <div class="subtitle">A R T &nbsp; F E S T &nbsp; &lsquo;26</div>
    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function(ev) {
      // The splash will be automatically covered or removed when Flutter renders.
    });
  </script>
</body>
</html>
